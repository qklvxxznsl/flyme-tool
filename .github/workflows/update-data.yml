name: update-firmware-data

# Triggers:
#   1) data/manual-urls.txt push
#   2) schedule 0 4 * * 6 UTC = 周六 12:00 Asia/Shanghai
#   3) manual workflow_dispatch
on:
  push:
    paths:
      - 'data/manual-urls.txt'
  schedule:
    - cron: '0 4 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update data (scrape official site + manual links)
        run: python tools/update_data.py --scrape

      - name: Verify sorting (fails the job when unsorted)
        run: python tools/check_sort.py

      - name: Check docs (thin check, rules from tools/docs-manifest.json)
        run: python tools/check_docs.py

      - name: Job Summary
        if: always()
        run: |
          unresolved=$(grep -vcE '^(#|$)' data/unresolved-links.txt || true)
          {
            echo "### Firmware data update"
            echo "- data/firmware.json: updated by tools/update_data.py"
            echo "- unresolved: $unresolved"
            echo "- file: data/unresolved-links.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/firmware.json data/unresolved-links.txt)" ]; then
            git add data/firmware.json data/unresolved-links.txt
            git commit -m "chore: update firmware data [skip ci]"
            git push
          else
            echo "no data changes"
          fi

      - name: Fail when unresolved links exist
        if: always()
        run: |
          if grep -qvE '^(#|$)' data/unresolved-links.txt; then
            echo "::error::unresolved links found; see data/unresolved-links.txt"
            exit 1
          fi
